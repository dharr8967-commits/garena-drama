<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GARENA DRAMA | Login</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    background: radial-gradient(ellipse at top, #381010, #080808 70%);
    color: white;
    font-family: Arial, sans-serif;
}

.box {
    width: 100%;
    max-width: 390px;
    padding: 30px 24px;
    background: #111;
    border: 1px solid #ff2929;
    border-radius: 15px;
    box-shadow: 0 0 28px #ff202033;
}

.logo {
    text-align: center;
    color: #ff2929;
    font-size: 27px;
    font-weight: 900;
    text-shadow: 0 0 12px #ff2020;
}

.subtitle {
    text-align: center;
    color: #aaa;
    font-size: 13px;
    margin: 12px 0 25px;
}

.tabs {
    display: flex;
    gap: 10px;
    margin-bottom: 22px;
}

.tabs button {
    flex: 1;
    padding: 12px 5px;
    background: #222;
    color: white;
    border: 1px solid #333;
    border-radius: 6px;
    font-weight: bold;
}

.tabs button.active {
    background: #ff2525;
    border-color: #ff2525;
}

label {
    display: block;
    margin: 14px 0 7px;
    font-size: 13px;
    color: #ddd;
}

input {
    width: 100%;
    padding: 13px;
    background: #080808;
    color: white;
    border: 1px solid #444;
    border-radius: 6px;
    outline: none;
}

input:focus {
    border-color: #ff2929;
}

.action {
    width: 100%;
    padding: 14px;
    margin-top: 20px;
    background: #ff2525;
    color: white;
    border: none;
    border-radius: 6px;
    font-size: 15px;
    font-weight: bold;
}

button {
    cursor: pointer;
}

.action:disabled {
    opacity: .6;
    cursor: wait;
}

.divider {
    text-align: center;
    color: #888;
    margin: 18px 0;
    font-size: 12px;
}

.google {
    width: 100%;
    padding: 13px;
    background: #1b1b1b;
    color: white;
    border: 1px solid #555;
    border-radius: 6px;
    font-weight: bold;
}

#message {
    margin-top: 16px;
    text-align: center;
    font-size: 13px;
    line-height: 1.6;
    overflow-wrap: anywhere;
}

.error {
    color: #ff7777;
}

.success {
    color: #65ff9b;
}

.back {
    display: block;
    margin-top: 22px;
    text-align: center;
    color: #aaa;
    font-size: 13px;
    text-decoration: none;
}

.back:hover {
    color: #ff2929;
}
</style>
</head>

<body>

<div class="box">

    <div class="logo">🔥 GARENA DRAMA</div>
    <p class="subtitle">Your Gaming Journey Starts Here</p>

    <div class="tabs">
        <button id="signupTab" class="active" type="button">
            SIGN UP
        </button>
        <button id="loginTab" type="button">
            LOGIN
        </button>
    </div>

    <form id="authForm">

        <div id="nameField">
            <label for="username">Your Name</label>
            <input
                id="username"
                type="text"
                placeholder="Enter your name"
                maxlength="40"
                autocomplete="name"
            >
        </div>

        <label for="email">Email Address</label>
        <input
            id="email"
            type="email"
            placeholder="Enter your email"
            autocomplete="email"
            required
        >

        <label for="password">Password</label>
        <input
            id="password"
            type="password"
            placeholder="At least 6 characters"
            minlength="6"
            autocomplete="current-password"
            required
        >

        <button id="submitBtn" class="action" type="submit">
            CREATE ACCOUNT
        </button>
    </form>

    <div class="divider">OR CONTINUE WITH</div>

    <button id="googleBtn" class="google" type="button">
        🌐 Continue with Google
    </button>

    <div id="message" role="status" aria-live="polite"></div>

    <a href="index.html" class="back">← Back to Welcome Page</a>

</div>

<script type="module">
import { initializeApp }
    from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";

import {
    getAuth,
    createUserWithEmailAndPassword,
    signInWithEmailAndPassword,
    GoogleAuthProvider,
    signInWithPopup,
    updateProfile
} from "https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js";

const firebaseConfig = {
    apiKey: "AIzaSyBdXzmsQWAHzu-16GioMYFRhZ7QfDQWRLs",
    authDomain: "garena-drama.firebaseapp.com",
    projectId: "garena-drama",
    storageBucket: "garena-drama.firebasestorage.app",
    messagingSenderId: "481915865901",
    appId: "1:481915865901:web:1545167bc734c1320c61a4",
    measurementId: "G-JKWL2W338L"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const googleProvider = new GoogleAuthProvider();

const form = document.getElementById("authForm");
const username = document.getElementById("username");
const nameField = document.getElementById("nameField");
const email = document.getElementById("email");
const password = document.getElementById("password");
const submitBtn = document.getElementById("submitBtn");
const googleBtn = document.getElementById("googleBtn");
const signupTab = document.getElementById("signupTab");
const loginTab = document.getElementById("loginTab");
const message = document.getElementById("message");

let mode = "signup";
let busy = false;

function showMessage(text, type = "error") {
    message.textContent = text;
    message.className = type;
}

function setMode(newMode) {
    mode = newMode;

    const signingUp = mode === "signup";

    nameField.hidden = !signingUp;
    username.required = signingUp;

    signupTab.classList.toggle("active", signingUp);
    loginTab.classList.toggle("active", !signingUp);

    submitBtn.textContent = signingUp
        ? "CREATE ACCOUNT"
        : "LOGIN";

    password.autocomplete = signingUp
        ? "new-password"
        : "current-password";

    showMessage("");
}

signupTab.addEventListener("click", () => setMode("signup"));
loginTab.addEventListener("click", () => setMode("login"));

function explainError(error) {
    const errors = {
        "auth/email-already-in-use":
            "এই ইমেইল দিয়ে অ্যাকাউন্ট আছে। Login করো।",

        "auth/invalid-email":
            "সঠিক ইমেইল ঠিকানা লিখো।",

        "auth/weak-password":
            "আরও শক্তিশালী পাসওয়ার্ড দাও।",

        "auth/invalid-credential":
            "ইমেইল বা পাসওয়ার্ড সঠিক নয়।",

        "auth/user-not-found":
            "এই ইমেইলে অ্যাকাউন্ট পাওয়া যায়নি।",

        "auth/wrong-password":
            "পাসওয়ার্ড সঠিক নয়।",

        "auth/popup-blocked":
            "Google Login-এর Popup ব্লক হয়েছে।",

        "auth/popup-closed-by-user":
            "Google Login বন্ধ হয়ে গেছে।",

        "auth/unauthorized-domain":
            "এই ওয়েবসাইটের Domain Firebase-এ অনুমোদিত নয়।",

        "auth/operation-not-allowed":
            "Firebase Console-এ এই Login পদ্ধতি চালু নেই।",

        "auth/network-request-failed":
            "ইন্টারনেট সংযোগ পরীক্ষা করো।"
    };

    return errors[error.code] ||
        "সমস্যা হয়েছে: " + (error.code || error.message);
}

function saveUser(user) {
    localStorage.setItem("gd_firebase_uid", user.uid);
    localStorage.setItem("gd_email", user.email || "");

    localStorage.setItem(
        "gd_username",
        user.displayName ||
        (user.email ? user.email.split("@")[0] : "Gamer")
    );
}

function goToProfile(user) {
    saveUser(user);
    showMessage("সফল হয়েছে! Profile পেজে যাচ্ছি...", "success");

    // Ensure navigation happens after authentication succeeds.
    window.location.assign(new URL("profile.html", window.location.href).href);
}

form.addEventListener("submit", async (event) => {
    event.preventDefault();

    if (busy) return;

    busy = true;
    submitBtn.disabled = true;
    googleBtn.disabled = true;

    showMessage("অপেক্ষা করো...");

    try {
        const userEmail = email.value.trim();
        const userPassword = password.value;

        if (mode === "signup") {
            const displayName = username.value.trim();

            if (!displayName) {
                throw new Error("তোমার নাম লিখো।");
            }

            const result = await createUserWithEmailAndPassword(
                auth,
                userEmail,
                userPassword
            );

            await updateProfile(result.user, {
                displayName: displayName
            });

            goToProfile(result.user);

        } else {
            const result = await signInWithEmailAndPassword(
                auth,
                userEmail,
                userPassword
            );

            goToProfile(result.user);
        }

    } catch (error) {
        showMessage(
            error.code ? explainError(error) : error.message
        );

    } finally {
        busy = false;
        submitBtn.disabled = false;
        googleBtn.disabled = false;
    }
});

googleBtn.addEventListener("click", async () => {
    if (busy) return;

    busy = true;
    submitBtn.disabled = true;
    googleBtn.disabled = true;

    showMessage("Google Login হচ্ছে...");

    try {
        const result = await signInWithPopup(auth, googleProvider);
        goToProfile(result.user);

    } catch (error) {
        showMessage(explainError(error));

    } finally {
        busy = false;
        submitBtn.disabled = false;
        googleBtn.disabled = false;
    }
});

setMode("signup");
</script>

</body>
</html>
